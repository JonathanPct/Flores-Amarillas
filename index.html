<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un ramo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens de color ---------- */
  :root {
    --bg1: #CFE8D2;
    --bg2: #FBEFD5;
    --ink: #3B4A2E;
    --ink-soft: #5F7050;
    --card: rgba(255, 255, 255, .62);
    --line: #A9CBA4;
    --accent: #FF6F9C;
    --glow: #FFF3B0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #16261C;
      --bg2: #2E3B22;
      --ink: #FFF1BF;
      --ink-soft: #CFE0C0;
      --card: rgba(255, 255, 255, .08);
      --line: #4D6B48;
      --glow: #FFD84D;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #16261C;
    --bg2: #2E3B22;
    --ink: #FFF1BF;
    --ink-soft: #CFE0C0;
    --card: rgba(255, 255, 255, .08);
    --line: #4D6B48;
    --glow: #FFD84D;
  }

  html { background-color: var(--bg2); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg1);
    background-image: linear-gradient(170deg, var(--bg1), var(--bg2));
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Fredoka", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* ---------- Capa ambiental de partículas ---------- */
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .float {
    position: absolute;
    bottom: -40px;
    animation: rise var(--dur, 8s) linear forwards;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
    10%  { opacity: .9; }
    50%  { transform: translate(var(--sway, 20px), -55vh) rotate(calc(var(--rot, 40deg) / 2)); }
    100% { transform: translate(calc(var(--sway, 20px) * -1), -115vh) rotate(var(--rot, 40deg)); opacity: 0; }
  }

  /* ---------- Estructura ---------- */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 22px 16px 36px;
    max-width: 460px;
    margin: 0 auto;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7.2vw, 2.4rem);
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
    letter-spacing: .01em;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 360 / 500;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .stage svg [data-hit] { cursor: pointer; outline: none; }
  .stage svg [data-hit]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  /* Globo de diálogo */
  .bubble {
    position: absolute;
    top: 1%;
    left: 50%;
    max-width: 88%;
    padding: 9px 16px;
    border-radius: 18px;
    background: #fff;
    color: #3B4A2E;
    font-size: clamp(.9rem, 3.8vw, 1.05rem);
    font-weight: 500;
    text-align: center;
    line-height: 1.25;
    box-shadow: 0 6px 18px rgba(74, 53, 96, .18);
    transform: translateX(-50%) scale(.6);
    transform-origin: 50% 100%;
    opacity: 0;
    transition: transform .28s cubic-bezier(.3, 1.6, .5, 1), opacity .2s;
    pointer-events: none;
    z-index: 3;
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 14px;
    height: 14px;
    background: #fff;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 4px 0;
  }

  /* Partículas de las explosiones al tocar */
  .burst {
    position: absolute;
    pointer-events: none;
    z-index: 4;
    animation: pop .95s ease-out forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r, 0deg)); opacity: 0; }
  }

  .hint { margin: -6px 0 0; font-size: .92rem; color: var(--ink-soft); text-align: center; }

  /* ---------- Tarjeta de mensaje ---------- */
  .card {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 16px 20px 18px;
    border: 2px solid var(--line);
    border-radius: 26px;
    background: var(--card);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    text-align: center;
  }
  .card .msg { margin: 0; font-size: 1.15rem; font-weight: 500; line-height: 1.45; }
  .card .from { margin: 10px 0 0; font-size: 1rem; color: var(--ink-soft); }
  .card .from:empty { display: none; }

  .actions { display: flex; gap: 10px; }
  button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .panel {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 16px 18px;
    border: 2px dashed var(--line);
    border-radius: 22px;
    display: grid;
    gap: 10px;
  }
  .panel[hidden] { display: none; }
  .panel label { display: grid; gap: 4px; font-size: .92rem; color: var(--ink-soft); }
  .panel input, .panel textarea {
    font: inherit;
    font-size: 1rem;
    color: #3B4A2E;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px;
    resize: none;
  }

  .panel .actions { justify-content: center; flex-wrap: wrap; }
  .panel .status { margin: 0; min-height: 1.2em; font-size: .92rem; color: var(--ink-soft); text-align: center; }
  .panel a { color: var(--ink); font-size: .92rem; text-align: center; }
  .panel input[readonly] { font-size: .85rem; text-overflow: ellipsis; }
  .recipient #editBtn, .recipient #panel { display: none !important; }

  /* ---------- Animaciones del personaje ---------- */
  #arrive { animation: arrive 1.9s ease-out both; }
  @keyframes arrive {
    0%   { transform: translate(-170px, 0); opacity: 0; }
    8%   { opacity: 1; }
    22%  { transform: translate(-130px, -28px); }
    36%  { transform: translate(-95px, 0); }
    50%  { transform: translate(-62px, -24px); }
    64%  { transform: translate(-34px, 0); }
    80%  { transform: translate(-10px, -14px); }
    100% { transform: translate(0, 0); opacity: 1; }
  }
  #bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  #jump { transform-box: fill-box; transform-origin: 50% 100%; }
  #jump.jump { animation: jump .65s cubic-bezier(.3, 1.2, .5, 1); }
  @keyframes jump {
    0%   { transform: translateY(0) scale(1.06, .92); }
    35%  { transform: translateY(-40px) scale(.95, 1.06); }
    70%  { transform: translateY(0) scale(1.08, .9); }
    100% { transform: translateY(0) scale(1); }
  }

  #head { transform-box: view-box; transform-origin: 180px 250px; animation: tilt 4.2s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }

  #bouquet { transform-box: view-box; transform-origin: 180px 420px; animation: sway 3.8s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

  .ear-l { transform-box: view-box; transform-origin: 112px 160px; animation: earL 5.5s ease-in-out infinite; }
  .ear-r { transform-box: view-box; transform-origin: 248px 160px; animation: earR 5.5s ease-in-out 1.1s infinite; }
  @keyframes earL { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-11deg); } 95% { transform: rotate(5deg); } }
  @keyframes earR { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(11deg); } 95% { transform: rotate(-5deg); } }

  .tail { transform-box: view-box; transform-origin: 236px 392px; animation: wag 2.6s ease-in-out infinite; }
  @keyframes wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(9deg); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .eye-move { transition: transform .14s ease-out; }

  .fl { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .fs { transform-box: fill-box; transform-origin: center; }
  .fs.spin { animation: spin .85s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(200deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .star { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes twinkle { 0%, 100% { transform: scale(.5); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>

<main>
  <h1>Para <span id="toName">alguien especial</span></h1>

  <div class="stage" id="stage">
    <div class="bubble" id="bubble" aria-live="polite"></div>

    <svg id="scene" viewBox="0 0 360 500" role="img" aria-label="Personaje kawaii con orejas de ratón, gafas redondas y sombrerito de paja, sosteniendo un ramo de flores amarillas con carita">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="var(--glow)" stop-opacity=".95"/>
          <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
        </radialGradient>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="2.2" fill="#CFE3B0"/>
          <circle cx="12" cy="12" r="1.8" fill="#FFD84D"/>
        </pattern>
      </defs>

      <!-- Resplandor y sombra -->
      <ellipse cx="180" cy="270" rx="175" ry="175" fill="url(#glow)"/>
      <ellipse cx="180" cy="470" rx="105" ry="12" fill="#000" opacity=".12"/>

      <!-- Destellos -->
      <g fill="#FFD84D">
        <g transform="translate(52 196)"><path class="star" style="--d:0s" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5Z"/></g>
        <g transform="translate(312 172)"><path class="star" style="--d:.7s" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5Z"/></g>
        <g transform="translate(36 310)"><path class="star" style="--d:1.3s" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2Z"/></g>
        <g transform="translate(326 300)"><path class="star" style="--d:1.9s" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2Z"/></g>
      </g>

      <g id="arrive"><g id="bob"><g id="jump">

        <!-- Zapatos -->
        <ellipse cx="140" cy="454" rx="22" ry="12" fill="#6B4A32" stroke="#4A3222" stroke-width="3"/>
        <ellipse cx="220" cy="454" rx="22" ry="12" fill="#6B4A32" stroke="#4A3222" stroke-width="3"/>

        <!-- Cola con lazo verde -->
        <g class="tail">
          <path d="M236 392 Q292 384 286 344 Q283 324 298 318" fill="none" stroke="#5B4030" stroke-width="10" stroke-linecap="round"/>
          <path d="M236 392 Q292 384 286 344 Q283 324 298 318" fill="none" stroke="#D39A78" stroke-width="5" stroke-linecap="round"/>
          <g transform="translate(287 354) rotate(-12)" stroke="#3F6A34" stroke-width="2" stroke-linejoin="round">
            <ellipse cx="-11" cy="0" rx="11" ry="6.5" transform="rotate(-20 -11 0)" fill="#6E9A57"/>
            <ellipse cx="11" cy="0" rx="11" ry="6.5" transform="rotate(20 11 0)" fill="#6E9A57"/>
            <circle r="4.5" fill="#86B06C"/>
          </g>
        </g>

        <!-- Cuerpo: falda, corpiño, tirantes y chal -->
        <g id="bodyG" data-hit tabindex="0" role="button" aria-label="Tocar al personaje">
          <path d="M126 372 L234 372 L254 442 Q180 462 106 442 Z" fill="#7B5537" stroke="#4A3222" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="180" cy="332" rx="54" ry="50" fill="#DCC57C" stroke="#4A3222" stroke-width="3"/>
          <g stroke="#B9A25E" stroke-width="2" opacity=".7" stroke-linecap="round">
            <line x1="162" y1="304" x2="160" y2="364"/><line x1="180" y1="300" x2="180" y2="366"/><line x1="198" y1="304" x2="200" y2="364"/>
          </g>
          <g stroke="#3A302C" stroke-width="8" stroke-linecap="round" fill="none">
            <path d="M146 292 L158 370"/><path d="M214 292 L202 370"/>
          </g>
          <rect x="126" y="366" width="108" height="14" rx="3" fill="#3A302C"/>
          <rect x="166" y="364" width="28" height="18" rx="3" fill="none" stroke="#BFAE86" stroke-width="3"/>
          <path d="M108 306 Q140 284 180 286 Q220 284 252 306 Q266 336 250 356 Q238 340 228 326 Q180 314 132 326 Q122 340 110 356 Q94 336 108 306 Z" fill="#C9A06B" stroke="#4A3222" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- Cabeza -->
        <g id="head" data-hit tabindex="0" role="button" aria-label="Tocar al personaje">
          <!-- Orejas redondas de ratón -->
          <g class="ear-l">
            <circle cx="108" cy="146" r="28" fill="#E5C592" stroke="#5B4030" stroke-width="3"/>
            <circle cx="110" cy="149" r="15" fill="#F0BFA6"/>
          </g>
          <g class="ear-r">
            <circle cx="252" cy="146" r="28" fill="#E5C592" stroke="#5B4030" stroke-width="3"/>
            <circle cx="250" cy="149" r="15" fill="#F0BFA6"/>
          </g>

          <!-- Cabello trasero, cuello y cara -->
          <path d="M90 196 Q86 122 180 118 Q274 122 270 196 Q276 246 250 270 L110 270 Q84 246 90 196 Z" fill="#6F4F35" stroke="#4E3624" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="180" cy="272" rx="20" ry="12" fill="#F8DCCB"/>
          <ellipse cx="180" cy="214" rx="66" ry="54" fill="#FFF0E6" stroke="#4E3624" stroke-width="3"/>

          <!-- Mejillas, bigotes, nariz y boca -->
          <ellipse cx="134" cy="240" rx="12" ry="7" fill="#FF9DA0" opacity=".55"/>
          <ellipse cx="226" cy="240" rx="12" ry="7" fill="#FF9DA0" opacity=".55"/>
          <g stroke="#5B4030" stroke-width="1.8" stroke-linecap="round" opacity=".8">
            <line x1="116" y1="226" x2="130" y2="229"/><line x1="116" y1="234" x2="130" y2="234"/><line x1="117" y1="242" x2="130" y2="239"/>
            <line x1="244" y1="226" x2="230" y2="229"/><line x1="244" y1="234" x2="230" y2="234"/><line x1="243" y1="242" x2="230" y2="239"/>
          </g>
          <ellipse cx="180" cy="227" rx="4.5" ry="3.2" fill="#E78E93"/>
          <path d="M172 236 Q180 244 188 236" fill="none" stroke="#5B4030" stroke-width="2.4" stroke-linecap="round"/>

          <!-- Ojos -->
          <g class="eye-move" id="eyeL"><g class="eye">
            <ellipse cx="148" cy="209" rx="8.5" ry="10" fill="#5E5048"/>
            <ellipse cx="148" cy="213" rx="5.5" ry="5" fill="#7C6E62"/>
            <circle cx="145.5" cy="204.5" r="3.2" fill="#fff"/><circle cx="151.5" cy="213" r="1.6" fill="#fff"/>
          </g></g>
          <g class="eye-move" id="eyeR"><g class="eye">
            <ellipse cx="212" cy="209" rx="8.5" ry="10" fill="#5E5048"/>
            <ellipse cx="212" cy="213" rx="5.5" ry="5" fill="#7C6E62"/>
            <circle cx="209.5" cy="204.5" r="3.2" fill="#fff"/><circle cx="215.5" cy="213" r="1.6" fill="#fff"/>
          </g></g>

          <!-- Gafas redondas -->
          <g fill="none" stroke="#34343C" stroke-width="3.2" stroke-linecap="round">
            <circle cx="148" cy="208" r="22" fill="#DFF0D8" fill-opacity=".25"/>
            <circle cx="212" cy="208" r="22" fill="#DFF0D8" fill-opacity=".25"/>
            <path d="M170 206 Q180 200 190 206"/>
            <path d="M126 206 L112 200"/><path d="M234 206 L248 200"/>
          </g>
          <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".75">
            <path d="M134 198 Q140 191 149 190"/><path d="M198 198 Q204 191 213 190"/>
          </g>

          <!-- Mechón lateral con lazo verde (se refleja en el otro lado) -->
          <g id="lockL">
            <path d="M113 196 Q98 236 104 262 Q94 282 108 302 Q124 310 128 290 Q126 270 124 256 Q118 230 125 190 Z" fill="#8B6644" stroke="#4E3624" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M112 254 Q108 276 114 296" fill="none" stroke="#6F4F35" stroke-width="2" stroke-linecap="round"/>
            <g transform="translate(110 244) rotate(-8)" stroke="#3F6A34" stroke-width="2" stroke-linejoin="round">
              <ellipse cx="-10" cy="0" rx="11" ry="7" transform="rotate(-22 -10 0)" fill="#6E9A57"/>
              <ellipse cx="10" cy="0" rx="11" ry="7" transform="rotate(22 10 0)" fill="#6E9A57"/>
              <circle r="4.5" fill="#86B06C"/>
            </g>
          </g>
          <use href="#lockL" transform="translate(360 0) scale(-1 1)"/>

          <!-- Flequillo recto -->
          <path d="M113 200 C104 128 152 118 180 118 C208 118 256 128 247 200 L238 180 Q226 188 214 178 Q198 188 180 178 Q162 188 146 178 Q134 188 122 180 Z" fill="#8B6644" stroke="#4E3624" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M132 150 Q180 132 228 150" fill="none" stroke="#B08A5E" stroke-width="5" stroke-linecap="round" opacity=".6"/>
          <g fill="none" stroke="#5E4230" stroke-width="1.6" stroke-linecap="round" opacity=".55">
            <path d="M146 130 Q142 158 146 178"/><path d="M164 122 Q162 152 164 184"/><path d="M180 120 L180 178"/><path d="M196 122 Q198 152 196 184"/><path d="M214 130 Q218 158 214 178"/>
          </g>

          <!-- Sombrerito de paja con banda verde -->
          <ellipse cx="180" cy="132" rx="50" ry="11" fill="#E8CE8E" stroke="#5B4030" stroke-width="3"/>
          <path d="M143 130 Q140 92 180 90 Q220 92 217 130 Z" fill="#EFD99B" stroke="#5B4030" stroke-width="3" stroke-linejoin="round"/>
          <path d="M143.5 121 Q180 131 216.5 121 L217 130 Q180 140 143 130 Z" fill="#6E9A57" stroke="#3F6A34" stroke-width="2" stroke-linejoin="round"/>
          <g fill="none" stroke="#C7A863" stroke-width="1.6" stroke-linecap="round">
            <circle cx="180" cy="106" r="8"/><circle cx="173" cy="97" r="3.2"/><circle cx="187" cy="97" r="3.2"/>
          </g>
          <g fill="#C7A863"><circle cx="177" cy="105" r="1"/><circle cx="183" cy="105" r="1"/></g>
        </g>

        <!-- Ramo -->
        <g id="bouquet">
          <!-- Mangas verdes por detrás del ramo (se refleja en el otro lado) -->
          <g id="sleeveL">
            <path d="M104 322 Q102 302 124 304 Q146 308 142 336 Q140 352 134 358 L110 360 Q98 344 104 322 Z" fill="#7A9B45" stroke="#4A6A30" stroke-width="3" stroke-linejoin="round"/>
            <path d="M108 350 Q122 355 136 350" fill="none" stroke="#5C7F38" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <use href="#sleeveL" transform="translate(360 0) scale(-1 1)"/>
          <!-- Tallos -->
          <g stroke="#4FA36B" stroke-width="4.5" stroke-linecap="round" fill="none">
            <path d="M128 282 Q150 320 180 350"/>
            <path d="M232 282 Q210 320 180 350"/>
            <path d="M92 322 Q135 336 180 350"/>
            <path d="M270 322 Q225 336 180 350"/>
            <path d="M180 298 L180 350"/>
          </g>
          <!-- Hojas -->
          <g fill="#6BC28A" stroke="#3F8F5F" stroke-width="2">
            <ellipse cx="146" cy="324" rx="19" ry="8" transform="rotate(-58 146 324)"/>
            <ellipse cx="214" cy="324" rx="19" ry="8" transform="rotate(58 214 324)"/>
          </g>

          <!-- Contenedor de flores (poblado desde JavaScript) -->
          <g id="flowers"></g>

          <!-- Papel de envoltura -->
          <path d="M124 322 Q152 314 180 322 Q208 314 236 322 L194 450 Q180 458 166 450 Z" fill="#FFFDF5"/>
          <path d="M124 322 Q152 314 180 322 Q208 314 236 322 L194 450 Q180 458 166 450 Z" fill="url(#dots)"/>
          <path d="M180 322 Q208 314 236 322 L194 450 Q187 456 180 457 Z" fill="#CFE3B0" opacity=".3"/>
          <path d="M124 322 Q152 314 180 322 Q208 314 236 322 L194 450 Q180 458 166 450 Z" fill="none" stroke="#5B4030" stroke-width="3" stroke-linejoin="round"/>

          <!-- Lazo -->
          <g stroke="#3F6A34" stroke-width="3" stroke-linejoin="round">
            <path d="M172 392 L160 420 L172 415 L176 428 L182 398 Z" fill="#6E9A57"/>
            <path d="M188 392 L200 420 L188 415 L184 428 L178 398 Z" fill="#6E9A57"/>
            <ellipse cx="160" cy="386" rx="19" ry="10" transform="rotate(-28 160 386)" fill="#6E9A57"/>
            <ellipse cx="200" cy="386" rx="19" ry="10" transform="rotate(28 200 386)" fill="#6E9A57"/>
            <circle cx="180" cy="392" r="8" fill="#86B06C"/>
          </g>

          <!-- Puños y manos que sujetan el borde del papel (se refleja en el otro lado) -->
          <g id="handL">
            <rect x="112" y="352" width="28" height="11" rx="5.5" transform="rotate(-8 126 357)" fill="#A9713A" stroke="#5B4030" stroke-width="2.5"/>
            <ellipse cx="141" cy="364" rx="12" ry="10.5" fill="#FFF0E6" stroke="#4E3624" stroke-width="2.5"/>
            <path d="M137 369 L137 374 M143 370 L143 375" stroke="#4E3624" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </g>
          <use href="#handL" transform="translate(360 0) scale(-1 1)"/>
        </g>

      </g></g></g>
    </svg>
  </div>

  <p class="hint">Toca al personaje, a las flores o al fondo.</p>

  <section class="card">
    <p class="msg" id="msg">Este ramo cruzó el prado con mucho cuidado solo para decirte: eres un sol.</p>
    <p class="from" id="fromLine"></p>
  </section>

  <div class="actions">
    <button id="editBtn" type="button" aria-expanded="false">Personalizar</button>
    <button id="soundBtn" type="button" aria-pressed="true" aria-label="Sonido activado">Sonido</button>
  </div>

  <div class="panel" id="panel" hidden>
    <label>Para
      <input id="inTo" type="text" maxlength="40" placeholder="alguien especial">
    </label>
    <label>Mensaje
      <textarea id="inMsg" rows="3" maxlength="140" placeholder="Escribe la dedicatoria"></textarea>
    </label>
    <label>De parte de
      <input id="inFrom" type="text" maxlength="40" placeholder="Nombre de quien envía (opcional)">
    </label>
    <label>Enlace para enviar
      <input id="linkOut" type="text" readonly>
    </label>
    <div class="actions">
      <button id="copyBtn" type="button">Copiar enlace</button>
      <button id="shareBtn" type="button" hidden>Compartir</button>
    </div>
    <p class="status" id="linkStatus" role="status"></p>
    <a id="previewLink" href="#" target="_blank" rel="noopener">Ver cómo lo verá quien lo reciba</a>
  </div>
</main>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var svg = document.getElementById('scene');
  var bubble = document.getElementById('bubble');

  /* ---------- Construcción de las flores ---------- */
  var PLUM = '#4A3222';
  function flowerMarkup(f) {
    var sun = f.type === 'sun';
    var n = sun ? 14 : 9;
    var r = f.r;
    var pw = r * (sun ? 0.17 : 0.24);
    var ph = r * (sun ? 0.46 : 0.42);
    var pr = r * (sun ? 0.62 : 0.64);
    var back = sun ? '#FFB800' : '#FFF27A';
    var front = '#FFD84D';
    var stroke = sun ? '#C98700' : '#E0B400';
    var center = sun ? '#D48A3C' : '#FFB347';
    var i, a, petals = '';

    for (i = 0; i < n; i++) {
      a = (i * 360 / n).toFixed(2);
      petals += '<ellipse cx="0" cy="' + (-pr) + '" rx="' + pw + '" ry="' + ph + '" transform="rotate(' + a + ')" fill="' + back + '" stroke="' + stroke + '" stroke-width="1.5"/>';
    }
    if (sun) {
      for (i = 0; i < n; i++) {
        a = (i * 360 / n + 360 / n / 2).toFixed(2);
        petals += '<ellipse cx="0" cy="' + (-r * 0.52) + '" rx="' + (pw * 0.9) + '" ry="' + (ph * 0.8) + '" transform="rotate(' + a + ')" fill="' + front + '" stroke="' + stroke + '" stroke-width="1.2"/>';
      }
    }

    var cr = r * 0.42;
    var face =
      '<circle cx="0" cy="0" r="' + cr + '" fill="' + center + '" stroke="#5B4030" stroke-width="2"/>' +
      '<circle cx="' + (-r * 0.14) + '" cy="' + (-r * 0.04) + '" r="' + (r * 0.055) + '" fill="' + PLUM + '"/>' +
      '<circle cx="' + (r * 0.14) + '" cy="' + (-r * 0.04) + '" r="' + (r * 0.055) + '" fill="' + PLUM + '"/>' +
      '<path d="M' + (-r * 0.07) + ' ' + (r * 0.08) + ' Q0 ' + (r * 0.17) + ' ' + (r * 0.07) + ' ' + (r * 0.08) + '" fill="none" stroke="' + PLUM + '" stroke-width="1.7" stroke-linecap="round"/>' +
      '<ellipse cx="' + (-r * 0.25) + '" cy="' + (r * 0.09) + '" rx="' + (r * 0.08) + '" ry="' + (r * 0.05) + '" fill="#FF8FAE" opacity=".85"/>' +
      '<ellipse cx="' + (r * 0.25) + '" cy="' + (r * 0.09) + '" rx="' + (r * 0.08) + '" ry="' + (r * 0.05) + '" fill="#FF8FAE" opacity=".85"/>';

    return '<g class="flower" data-hit tabindex="0" role="button" aria-label="Flor amarilla" transform="translate(' + f.x + ' ' + f.y + ')">' +
      '<g class="fl" style="--d:' + f.d + 's"><g class="fs">' + petals + face + '</g></g></g>';
  }

  var flowers = [
    { type: 'daisy', x: 128, y: 282, r: 32, d: 0 },
    { type: 'daisy', x: 232, y: 282, r: 32, d: 0.6 },
    { type: 'sun',   x: 92,  y: 322, r: 27, d: 1.1 },
    { type: 'daisy', x: 270, y: 322, r: 26, d: 1.6 },
    { type: 'sun',   x: 180, y: 298, r: 42, d: 0.3 }
  ];
  document.getElementById('flowers').innerHTML = flowers.map(flowerMarkup).join('');

  /* ---------- Sonido (Web Audio, tras una acción del usuario) ---------- */
  var audio = null;
  var soundOn = true;
  function tone(freq, dur, type, slideTo, vol) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var t = audio.currentTime;
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* Audio no disponible: la ejecución continúa sin sonido */ }
  }
  function squeak() {
    tone(900, 0.12, 'sine', 1700, 0.07);
    setTimeout(function () { tone(1300, 0.1, 'sine', 2100, 0.06); }, 90);
  }
  var scale = [523.25, 587.33, 659.25, 783.99, 880];
  function ding() {
    tone(scale[Math.floor(Math.random() * scale.length)], 0.4, 'triangle', null, 0.07);
  }

  /* ---------- Formas de las partículas (SVG en línea) ---------- */
  var SHAPES = {
    heart: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z" fill="#FF8FAE"/></svg>',
    spark: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#FFD84D"/></svg>',
    flower: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><g fill="#FFE66D" stroke="#E0B400" stroke-width=".8"><circle cx="12" cy="6.8" r="4.4"/><circle cx="16.9" cy="10.4" r="4.4"/><circle cx="15" cy="16.2" r="4.4"/><circle cx="9" cy="16.2" r="4.4"/><circle cx="7.1" cy="10.4" r="4.4"/></g><circle cx="12" cy="12" r="3.3" fill="#FFB347"/></svg>'
  };

  /* ---------- Partículas al tocar ---------- */
  function burst(clientX, clientY, emojis, count, upward) {
    var rect = stage.getBoundingClientRect();
    for (var i = 0; i < count; i++) {
      var el = document.createElement('span');
      var angle = upward ? (-Math.PI / 2 + (Math.random() - 0.5) * 1.6) : Math.random() * Math.PI * 2;
      var dist = 50 + Math.random() * 60;
      el.className = 'burst';
      el.innerHTML = SHAPES[emojis[Math.floor(Math.random() * emojis.length)]];
      el.style.left = (clientX - rect.left) + 'px';
      el.style.top = (clientY - rect.top) + 'px';
      el.style.fontSize = (16 + Math.random() * 12) + 'px';
      el.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--dy', (Math.sin(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--r', ((Math.random() - 0.5) * 120).toFixed(0) + 'deg');
      el.addEventListener('animationend', function () { this.remove(); });
      stage.appendChild(el);
    }
  }

  /* ---------- Globo de diálogo ---------- */
  var lines = [
    '¡Tengo algo para ti!',
    '¡Squeak squeak!',
    'Eres un sol',
    'Vine corriendo con flores',
    '¡Te mando un abrazo!',
    'Las amarillas dan alegría'
  ];
  var lineIdx = 0;
  var bubbleTimer = null;
  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, ms || 2800);
  }
  setTimeout(function () { say(lines[0], 3200); lineIdx = 1; }, reduceMotion ? 300 : 2100);

  /* ---------- Interacción con el personaje ---------- */
  var jumpEl = document.getElementById('jump');
  function mouseTap() {
    jumpEl.classList.remove('jump');
    void jumpEl.getBoundingClientRect();
    jumpEl.classList.add('jump');
    squeak();
    say(lines[lineIdx % lines.length]);
    lineIdx++;
    var h = document.getElementById('head').getBoundingClientRect();
    burst(h.left + h.width / 2, h.top + 10, ['heart', 'spark'], 8, true);
  }
  ['head', 'bodyG'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('click', mouseTap);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mouseTap(); }
    });
  });

  /* ---------- Interacción con las flores ---------- */
  function flowerTap(el) {
    var fs = el.querySelector('.fs');
    fs.classList.remove('spin');
    void fs.getBoundingClientRect();
    fs.classList.add('spin');
    ding();
    var b = el.getBoundingClientRect();
    burst(b.left + b.width / 2, b.top + b.height / 2, ['spark', 'heart', 'flower'], 7, false);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.flower'), function (el) {
    el.addEventListener('click', function () { flowerTap(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flowerTap(el); }
    });
  });

  /* ---------- Toque en el fondo ---------- */
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('[data-hit]')) return;
    burst(e.clientX, e.clientY, ['flower', 'spark', 'heart'], 6, false);
    tone(1046.5, 0.25, 'triangle', null, 0.05);
  });

  /* ---------- Los ojos siguen al puntero ---------- */
  var eyes = [document.getElementById('eyeL'), document.getElementById('eyeR')];
  function look(x, y) {
    var r = svg.getBoundingClientRect();
    var cx = r.left + r.width * (180 / 360);
    var cy = r.top + r.height * (205 / 500);
    var dx = x - cx, dy = y - cy;
    var d = Math.hypot(dx, dy) || 1;
    var k = Math.min(1, d / 180) * 3.6;
    var mx = (dx / d) * k, my = (dy / d) * k * 0.8;
    eyes.forEach(function (el) { el.style.transform = 'translate(' + mx.toFixed(2) + 'px,' + my.toFixed(2) + 'px)'; });
  }
  document.addEventListener('pointermove', function (e) { look(e.clientX, e.clientY); });
  document.addEventListener('pointerdown', function (e) { look(e.clientX, e.clientY); });

  /* ---------- Partículas ambientales ---------- */
  var sky = document.getElementById('sky');
  var ambient = ['flower', 'spark', 'heart', 'flower', 'spark'];
  function spawnFloat() {
    if (document.hidden || sky.children.length > 12) return;
    var el = document.createElement('span');
    el.className = 'float';
    el.innerHTML = SHAPES[ambient[Math.floor(Math.random() * ambient.length)]];
    el.style.left = (Math.random() * 96) + '%';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    el.style.setProperty('--dur', (7 + Math.random() * 5).toFixed(1) + 's');
    el.style.setProperty('--sway', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
    el.style.setProperty('--rot', ((Math.random() - 0.5) * 160).toFixed(0) + 'deg');
    el.addEventListener('animationend', function () { el.remove(); });
    sky.appendChild(el);
  }
  if (!reduceMotion) {
    for (var s = 0; s < 4; s++) setTimeout(spawnFloat, s * 400);
    setInterval(spawnFloat, 1300);
  }

  /* ---------- Personalización del regalo ---------- */
  /* Modo remitente: sin datos en la URL; el texto se guarda en el navegador.
     Modo destinatario: la URL incluye la dedicatoria en el fragmento (#para=...&msg=...&de=...). */
  var DEFAULT_TO = 'alguien especial';
  var DEFAULT_MSG = 'Este ramo cruzó el prado con mucho cuidado solo para decirte: eres un sol.';
  var STORE_KEY = 'ramo-dedicatoria';

  var inTo = document.getElementById('inTo');
  var inMsg = document.getElementById('inMsg');
  var inFrom = document.getElementById('inFrom');
  var linkOut = document.getElementById('linkOut');
  var linkStatus = document.getElementById('linkStatus');
  var previewLink = document.getElementById('previewLink');
  var toName = document.getElementById('toName');
  var msg = document.getElementById('msg');
  var fromLine = document.getElementById('fromLine');

  function readShared() {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    var v = { to: params.get('para') || '', msg: params.get('msg') || '', from: params.get('de') || '' };
    return (v.to || v.msg || v.from) ? v : null;
  }
  function readStored() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeStored(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ }
  }
  function currentValues() {
    return { to: inTo.value.trim(), msg: inMsg.value.trim(), from: inFrom.value.trim() };
  }
  function buildLink(v) {
    var params = new URLSearchParams();
    if (v.to) params.set('para', v.to);
    if (v.msg) params.set('msg', v.msg);
    if (v.from) params.set('de', v.from);
    var query = params.toString();
    return location.href.split('#')[0] + (query ? '#' + query : '');
  }
  function refresh() {
    var v = currentValues();
    toName.textContent = v.to || DEFAULT_TO;
    msg.textContent = v.msg || DEFAULT_MSG;
    fromLine.textContent = v.from ? 'Con cariño, ' + v.from : '';
    var link = buildLink(v);
    linkOut.value = link;
    previewLink.href = link;
    return v;
  }

  var shared = readShared();
  var initial = shared || readStored() || { to: '', msg: '', from: '' };
  inTo.value = initial.to || '';
  inMsg.value = initial.msg || '';
  inFrom.value = initial.from || '';
  if (shared) document.body.classList.add('recipient');
  refresh();

  [inTo, inMsg, inFrom].forEach(function (el) {
    el.addEventListener('input', function () {
      writeStored(refresh());
      linkStatus.textContent = '';
    });
  });
  window.addEventListener('hashchange', function () { location.reload(); });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var link = linkOut.value;
    var done = function () { linkStatus.textContent = 'Enlace copiado. Ya se puede enviar.'; };
    var fallback = function () {
      linkOut.focus();
      linkOut.select();
      linkStatus.textContent = 'Selecciona el enlace y cópialo manualmente.';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, fallback);
    } else {
      fallback();
    }
  });

  var shareBtn = document.getElementById('shareBtn');
  if (navigator.share) {
    shareBtn.hidden = false;
    shareBtn.addEventListener('click', function () {
      navigator.share({ title: 'Un ramo para ti', url: linkOut.value }).catch(function () { /* cancelado */ });
    });
  }

  var panel = document.getElementById('panel');
  var editBtn = document.getElementById('editBtn');
  editBtn.addEventListener('click', function () {
    var open = panel.hasAttribute('hidden');
    if (open) { panel.removeAttribute('hidden'); inTo.focus(); } else { panel.setAttribute('hidden', ''); }
    editBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    editBtn.textContent = open ? 'Listo' : 'Personalizar';
  });

  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', soundOn ? 'Sonido activado' : 'Sonido desactivado');
    soundBtn.textContent = soundOn ? 'Sonido' : 'Sin sonido';
  });
})();
</script>
</body>
</html>
