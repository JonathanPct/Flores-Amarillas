<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un ramo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg1: #CFE8D2;
    --bg2: #FBEFD5;
    --ink: #3B4A2E;
    --ink-soft: #5F7050;
    --card: rgba(255, 255, 255, .62);
    --line: #A9CBA4;
    --accent: #FF6F9C;
    --glow: #FFF3B0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #16261C;
      --bg2: #2E3B22;
      --ink: #FFF1BF;
      --ink-soft: #CFE0C0;
      --card: rgba(255, 255, 255, .08);
      --line: #4D6B48;
      --glow: #FFD84D;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #16261C;
    --bg2: #2E3B22;
    --ink: #FFF1BF;
    --ink-soft: #CFE0C0;
    --card: rgba(255, 255, 255, .08);
    --line: #4D6B48;
    --glow: #FFD84D;
  }

  html { background-color: var(--bg2); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg1);
    background-image: linear-gradient(170deg, var(--bg1), var(--bg2));
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Fredoka", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .float {
    position: absolute;
    bottom: -40px;
    animation: rise var(--dur, 8s) linear forwards;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
    10%  { opacity: .9; }
    50%  { transform: translate(var(--sway, 20px), -55vh) rotate(calc(var(--rot, 40deg) / 2)); }
    100% { transform: translate(calc(var(--sway, 20px) * -1), -115vh) rotate(var(--rot, 40deg)); opacity: 0; }
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 22px 16px 36px;
    max-width: 460px;
    margin: 0 auto;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 7.2vw, 2.4rem);
    font-weight: 600;
    text-align: center;
    line-height: 1.15;
    letter-spacing: .01em;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 360 / 500;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .stage svg [data-hit] { cursor: pointer; outline: none; }
  .stage svg [data-hit]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  .bubble {
    position: absolute;
    top: 1%;
    left: 50%;
    max-width: 88%;
    padding: 9px 16px;
    border-radius: 18px;
    background: #fff;
    color: #3B4A2E;
    font-size: clamp(.9rem, 3.8vw, 1.05rem);
    font-weight: 500;
    text-align: center;
    line-height: 1.25;
    box-shadow: 0 6px 18px rgba(74, 53, 96, .18);
    transform: translateX(-50%) scale(.6);
    transform-origin: 50% 100%;
    opacity: 0;
    transition: transform .28s cubic-bezier(.3, 1.6, .5, 1), opacity .2s;
    pointer-events: none;
    z-index: 3;
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 14px;
    height: 14px;
    background: #fff;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 4px 0;
  }

  .burst {
    position: absolute;
    pointer-events: none;
    z-index: 4;
    animation: pop .95s ease-out forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r, 0deg)); opacity: 0; }
  }

  .hint { margin: -6px 0 0; font-size: .92rem; color: var(--ink-soft); text-align: center; }

  .card {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 16px 20px 18px;
    border: 2px solid var(--line);
    border-radius: 26px;
    background: var(--card);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    text-align: center;
  }
  .card .msg { margin: 0; font-size: 1.15rem; font-weight: 500; line-height: 1.45; }
  .card .from { margin: 10px 0 0; font-size: 1rem; color: var(--ink-soft); }
  .card .from:empty { display: none; }

  .actions { display: flex; gap: 10px; }
  button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .panel {
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 16px 18px;
    border: 2px dashed var(--line);
    border-radius: 22px;
    display: grid;
    gap: 10px;
  }
  .panel[hidden] { display: none; }
  .panel label { display: grid; gap: 4px; font-size: .92rem; color: var(--ink-soft); }
  .panel input, .panel textarea {
    font: inherit;
    font-size: 1rem;
    color: #3B4A2E;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px;
    resize: none;
  }

  .panel .actions { justify-content: center; flex-wrap: wrap; }
  .panel .status { margin: 0; min-height: 1.2em; font-size: .92rem; color: var(--ink-soft); text-align: center; }
  .panel a { color: var(--ink); font-size: .92rem; text-align: center; }
  .panel input[readonly] { font-size: .85rem; text-overflow: ellipsis; }
  .recipient #editBtn, .recipient #panel { display: none !important; }
  body.pending h1, body.pending .card { opacity: 0; }

  #arrive { animation: arrive 1.9s ease-out both; }
  @keyframes arrive {
    0%   { transform: translate(-170px, 0); opacity: 0; }
    8%   { opacity: 1; }
    22%  { transform: translate(-130px, -28px); }
    36%  { transform: translate(-95px, 0); }
    50%  { transform: translate(-62px, -24px); }
    64%  { transform: translate(-34px, 0); }
    80%  { transform: translate(-10px, -14px); }
    100% { transform: translate(0, 0); opacity: 1; }
  }
  #bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  #jump { transform-box: fill-box; transform-origin: 50% 100%; }
  #jump.jump { animation: jump .65s cubic-bezier(.3, 1.2, .5, 1); }
  @keyframes jump {
    0%   { transform: translateY(0) scale(1.06, .92); }
    35%  { transform: translateY(-40px) scale(.95, 1.06); }
    70%  { transform: translateY(0) scale(1.08, .9); }
    100% { transform: translateY(0) scale(1); }
  }

  #head, #headB, #headC { transform-box: view-box; transform-origin: 180px 250px; animation: tilt 4.2s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }

  #bouquet { transform-box: view-box; transform-origin: 180px 420px; animation: sway 3.8s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

  .ear-l { transform-box: view-box; transform-origin: 112px 160px; animation: earL 5.5s ease-in-out infinite; }
  .ear-r { transform-box: view-box; transform-origin: 248px 160px; animation: earR 5.5s ease-in-out 1.1s infinite; }
  @keyframes earL { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-11deg); } 95% { transform: rotate(5deg); } }
  @keyframes earR { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(11deg); } 95% { transform: rotate(-5deg); } }

  .tail { transform-box: view-box; transform-origin: 236px 392px; animation: wag 2.6s ease-in-out infinite; }
  .tailC { transform-box: view-box; transform-origin: 138px 414px; animation: wag 2.6s ease-in-out infinite; }
  @keyframes wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(9deg); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .eye-move { transition: transform .14s ease-out; }

  .fl { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .fs { transform-box: fill-box; transform-origin: center; }
  .fs.spin { animation: spin .85s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); }
    50%  { transform: rotate(200deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .star { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes twinkle { 0%, 100% { transform: scale(.5); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }

  body[data-pj="a"] .pj-b, body[data-pj="a"] .pj-c,
  body[data-pj="b"] .pj-a, body[data-pj="b"] .pj-c,
  body[data-pj="c"] .pj-a, body[data-pj="c"] .pj-b { display: none; }
  .earB-l { transform-box: view-box; transform-origin: 122px 240px; animation: earL 6s ease-in-out infinite; }
  .earB-r { transform-box: view-box; transform-origin: 238px 240px; animation: earR 6s ease-in-out 1.6s infinite; }

  .panel .field-label { font-size: .92rem; color: var(--ink-soft); }
  .panel .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel .choice { flex: 1 1 96px; padding: 8px 12px; font-size: .95rem; }
  .panel .choice[aria-checked="true"] { background: var(--ink); color: var(--bg1); border-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

      <input id="linkOut" type="text" readonly>
    </label>
    <div class="actions">
      <button id="copyBtn" type="button">Copiar enlace</button>
      <button id="shareBtn" type="button" hidden>Compartir</button>
    </div>
    <p class="status" id="linkStatus" role="status"></p>
    <a id="previewLink" href="#" target="_blank" rel="noopener">Ver cómo lo verá quien lo reciba</a>
  </div>
</main>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var svg = document.getElementById('scene');
  var bubble = document.getElementById('bubble');

  var INK = '#4A3222';
  var FLOWER_SIZE = 31;
  var FLOWER_POSITIONS = [
    { x: 132, y: 284, d: 0 },
    { x: 228, y: 284, d: 0.6 },
    { x: 96, y: 322, d: 1.1 },
    { x: 264, y: 322, d: 1.6 },
    { x: 180, y: 296, d: 0.3 }
  ];

  function flowerMarkup(f) {
    var r = FLOWER_SIZE;
    var n = 14;
    var pw = r * 0.17;
    var ph = r * 0.46;
    var pr = r * 0.62;
    var petals = '';
    var i, angle;

    for (i = 0; i < n; i++) {
      angle = (i * 360 / n).toFixed(2);
      petals += '<ellipse cx="0" cy="' + (-pr) + '" rx="' + pw + '" ry="' + ph + '" transform="rotate(' + angle + ')" fill="#FFB800" stroke="#C98700" stroke-width="1.5"/>';
    }
    for (i = 0; i < n; i++) {
      angle = (i * 360 / n + 360 / n / 2).toFixed(2);
      petals += '<ellipse cx="0" cy="' + (-r * 0.52) + '" rx="' + (pw * 0.9) + '" ry="' + (ph * 0.8) + '" transform="rotate(' + angle + ')" fill="#FFD84D" stroke="#C98700" stroke-width="1.2"/>';
    }

    var face =
      '<circle cx="0" cy="0" r="' + (r * 0.42) + '" fill="#D48A3C" stroke="#5B4030" stroke-width="2"/>' +
      '<circle cx="' + (-r * 0.14) + '" cy="' + (-r * 0.04) + '" r="' + (r * 0.055) + '" fill="' + INK + '"/>' +
      '<circle cx="' + (r * 0.14) + '" cy="' + (-r * 0.04) + '" r="' + (r * 0.055) + '" fill="' + INK + '"/>' +
      '<path d="M' + (-r * 0.07) + ' ' + (r * 0.08) + ' Q0 ' + (r * 0.17) + ' ' + (r * 0.07) + ' ' + (r * 0.08) + '" fill="none" stroke="' + INK + '" stroke-width="1.7" stroke-linecap="round"/>' +
      '<ellipse cx="' + (-r * 0.25) + '" cy="' + (r * 0.09) + '" rx="' + (r * 0.08) + '" ry="' + (r * 0.05) + '" fill="#FF8FAE" opacity=".85"/>' +
      '<ellipse cx="' + (r * 0.25) + '" cy="' + (r * 0.09) + '" rx="' + (r * 0.08) + '" ry="' + (r * 0.05) + '" fill="#FF8FAE" opacity=".85"/>';

    return '<g class="flower" data-hit tabindex="0" role="button" aria-label="Flor amarilla" transform="translate(' + f.x + ' ' + f.y + ')">' +
      '<g class="fl" style="--d:' + f.d + 's"><g class="fs">' + petals + face + '</g></g></g>';
  }

  document.getElementById('flowers').innerHTML = FLOWER_POSITIONS.map(flowerMarkup).join('');

  var audio = null;
  var soundOn = true;
  function tone(freq, dur, type, slideTo, vol) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var t = audio.currentTime;
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  }
  function squeak() {
    if (currentPj() === 'b') {
      tone(330, 0.2, 'triangle', 250, 0.08);
      return;
    }
    if (currentPj() === 'c') {
      [0, 130, 260].forEach(function (delay) {
        setTimeout(function () { tone(720, 0.09, 'triangle', 980, 0.06); }, delay);
      });
      return;
    }
    tone(900, 0.12, 'sine', 1700, 0.07);
    setTimeout(function () { tone(1300, 0.1, 'sine', 2100, 0.06); }, 90);
  }
  var scale = [523.25, 587.33, 659.25, 783.99, 880];
  function ding() {
    tone(scale[Math.floor(Math.random() * scale.length)], 0.4, 'triangle', null, 0.07);
  }

  var SHAPES = {
    heart: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z" fill="#FF8FAE"/></svg>',
    spark: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#FFD84D"/></svg>',
    flower: '<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:block"><g fill="#FFC933" stroke="#C98700" stroke-width=".8"><circle cx="12" cy="4.8" r="3.6"/><circle cx="17.1" cy="6.9" r="3.6"/><circle cx="19.2" cy="12" r="3.6"/><circle cx="17.1" cy="17.1" r="3.6"/><circle cx="12" cy="19.2" r="3.6"/><circle cx="6.9" cy="17.1" r="3.6"/><circle cx="4.8" cy="12" r="3.6"/><circle cx="6.9" cy="6.9" r="3.6"/></g><circle cx="12" cy="12" r="4.4" fill="#D48A3C"/></svg>'
  };

  function burst(clientX, clientY, emojis, count, upward) {
    var rect = stage.getBoundingClientRect();
    for (var i = 0; i < count; i++) {
      var el = document.createElement('span');
      var angle = upward ? (-Math.PI / 2 + (Math.random() - 0.5) * 1.6) : Math.random() * Math.PI * 2;
      var dist = 50 + Math.random() * 60;
      el.className = 'burst';
      el.innerHTML = SHAPES[emojis[Math.floor(Math.random() * emojis.length)]];
      el.style.left = (clientX - rect.left) + 'px';
      el.style.top = (clientY - rect.top) + 'px';
      el.style.fontSize = (16 + Math.random() * 12) + 'px';
      el.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--dy', (Math.sin(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--r', ((Math.random() - 0.5) * 120).toFixed(0) + 'deg');
      el.addEventListener('animationend', function () { this.remove(); });
      stage.appendChild(el);
    }
  }

  var LINES = {
    a: [
      '¡Tengo algo para ti!',
      '¡Squeak squeak!',
      'Eres un sol',
      'Vine corriendo con flores',
      '¡Te mando un abrazo!',
      'Las amarillas dan alegría'
    ],
    c: ['LIZARD LIZARD LIZARD'],
    b: [
      'Hmm. Esto es para ti.',
      'Cuidado con los cuernos.',
      'Practiqué esta entrega.',
      'Acepta el ramo, por favor.',
      'Sonríe un poco, anda.',
      'Las flores no se me caen.'
    ]
  };
  function currentPj() {
    var value = document.body.getAttribute('data-pj');
    return value === 'b' || value === 'c' ? value : 'a';
  }
  var lineIdx = 0;
  var bubbleTimer = null;
  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, ms || 2800);
  }
  setTimeout(function () { say(LINES[currentPj()][0], 3200); lineIdx = 1; }, reduceMotion ? 300 : 2100);

  var jumpEl = document.getElementById('jump');
  function activeHead() {
    return document.getElementById({ a: 'head', b: 'headB', c: 'headC' }[currentPj()]);
  }
  function mouseTap() {
    jumpEl.classList.remove('jump');
    void jumpEl.getBoundingClientRect();
    jumpEl.classList.add('jump');
    squeak();
    var set = LINES[currentPj()];
    say(set[lineIdx % set.length]);
    lineIdx++;
    var h = activeHead().getBoundingClientRect();
    burst(h.left + h.width / 2, h.top + 10, ['heart', 'spark'], 8, true);
  }
  ['head', 'bodyG', 'headB', 'bodyB', 'headC', 'bodyC'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('click', mouseTap);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mouseTap(); }
    });
  });

  function flowerTap(el) {
    var fs = el.querySelector('.fs');
    fs.classList.remove('spin');
    void fs.getBoundingClientRect();
    fs.classList.add('spin');
    ding();
    var b = el.getBoundingClientRect();
    burst(b.left + b.width / 2, b.top + b.height / 2, ['spark', 'heart', 'flower'], 7, false);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.flower'), function (el) {
    el.addEventListener('click', function () { flowerTap(el); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flowerTap(el); }
    });
  });

  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('[data-hit]')) return;
    burst(e.clientX, e.clientY, ['flower', 'spark', 'heart'], 6, false);
    tone(1046.5, 0.25, 'triangle', null, 0.05);
  });

  var eyes = Array.prototype.slice.call(document.querySelectorAll('.eye-move'));
  function look(x, y) {
    var r = svg.getBoundingClientRect();
    var cx = r.left + r.width * (180 / 360);
    var cy = r.top + r.height * (205 / 500);
    var dx = x - cx, dy = y - cy;
    var d = Math.hypot(dx, dy) || 1;
    var k = Math.min(1, d / 180) * 3.6;
    var mx = (dx / d) * k, my = (dy / d) * k * 0.8;
    eyes.forEach(function (el) { el.style.transform = 'translate(' + mx.toFixed(2) + 'px,' + my.toFixed(2) + 'px)'; });
  }
  document.addEventListener('pointermove', function (e) { look(e.clientX, e.clientY); });
  document.addEventListener('pointerdown', function (e) { look(e.clientX, e.clientY); });

  var sky = document.getElementById('sky');
  var ambient = ['flower', 'spark', 'heart', 'flower', 'spark'];
  function spawnFloat() {
    if (document.hidden || sky.children.length > 12) return;
    var el = document.createElement('span');
    el.className = 'float';
    el.innerHTML = SHAPES[ambient[Math.floor(Math.random() * ambient.length)]];
    el.style.left = (Math.random() * 96) + '%';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    el.style.setProperty('--dur', (7 + Math.random() * 5).toFixed(1) + 's');
    el.style.setProperty('--sway', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
    el.style.setProperty('--rot', ((Math.random() - 0.5) * 160).toFixed(0) + 'deg');
    el.addEventListener('animationend', function () { el.remove(); });
    sky.appendChild(el);
  }
  if (!reduceMotion) {
    for (var s = 0; s < 4; s++) setTimeout(spawnFloat, s * 400);
    setInterval(spawnFloat, 1300);
  }

  var DEFAULT_TO = 'alguien especial';
  var DEFAULT_MSG = 'Un pequeño detalle para ti, con cariño.';
  var STORE_KEY = 'ramo-dedicatoria';

  var inTo = document.getElementById('inTo');
  var inMsg = document.getElementById('inMsg');
  var inFrom = document.getElementById('inFrom');
  var linkOut = document.getElementById('linkOut');
  var linkStatus = document.getElementById('linkStatus');
  var previewLink = document.getElementById('previewLink');
  var toName = document.getElementById('toName');
  var msg = document.getElementById('msg');
  var fromLine = document.getElementById('fromLine');
  var choices = Array.prototype.slice.call(document.querySelectorAll('.choice'));
  var pj = 'a';

  function setCharacter(value) {
    pj = value === 'b' || value === 'c' ? value : 'a';
    document.body.setAttribute('data-pj', pj);
    choices.forEach(function (btn) {
      btn.setAttribute('aria-checked', btn.getAttribute('data-pj') === pj ? 'true' : 'false');
    });
  }

  var canCompress = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
  var MASK = [23, 91, 154, 7, 201, 68];
  var SEP = '\u0001';

  function mask(bytes) {
    var out = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ MASK[i % MASK.length] ^ (i & 255);
    return out;
  }
  function toB64(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function fromB64(text) {
    var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function transform(bytes, Ctor) {
    var stream = new Blob([bytes]).stream().pipeThrough(new Ctor('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }
  function encodeValues(v) {
    var text = [v.pj === 'b' ? '1' : v.pj === 'c' ? '2' : '0', v.to, v.msg, v.from].join(SEP);
    var bytes = new TextEncoder().encode(text);
    var plain = function () { return 'p' + toB64(mask(bytes)); };
    if (!canCompress) return Promise.resolve(plain());
    return transform(bytes, CompressionStream).then(function (packed) {
      return 'z' + toB64(mask(packed));
    }).catch(plain);
  }
  function decodeToken(token) {
    var raw;
    try { raw = mask(fromB64(token.slice(1))); } catch (e) { return Promise.resolve(null); }
    var toValues = function (bytes) {
      var parts = new TextDecoder().decode(bytes).split(SEP);
      return { pj: parts[0] === '1' ? 'b' : parts[0] === '2' ? 'c' : 'a', to: parts[1] || '', msg: parts[2] || '', from: parts[3] || '' };
    };
    var kind = token.charAt(0);
    if (kind === 'p') return Promise.resolve(toValues(raw));
    if (kind === 'z' && canCompress) return transform(raw, DecompressionStream).then(toValues).catch(function () { return null; });
    return Promise.resolve(null);
  }

  function readShared() {
    var hash = location.hash.replace(/^#/, '');
    if (!hash) return Promise.resolve(null);
    if (hash.indexOf('=') === -1) return decodeToken(hash);
    var params = new URLSearchParams(hash);
    var v = { to: params.get('para') || '', msg: params.get('msg') || '', from: params.get('de') || '', pj: params.get('pj') || '' };
    return Promise.resolve((v.to || v.msg || v.from || v.pj) ? v : null);
  }
  function readStored() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeStored(v) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) {}
  }
  function currentValues() {
    return { to: inTo.value.trim(), msg: inMsg.value.trim(), from: inFrom.value.trim(), pj: pj };
  }

  var linkSeq = 0;
  function setLink(link) {
    linkOut.value = link;
    previewLink.href = link;
  }
  function updateLink(v) {
    var seq = ++linkSeq;
    var base = location.href.split('#')[0];
    if (!v.to && !v.msg && !v.from && v.pj === 'a') {
      setLink(base);
      return;
    }
    encodeValues(v).then(function (token) {
      if (seq === linkSeq) setLink(base + '#' + token);
    });
  }
  function refresh() {
    var v = currentValues();
    toName.textContent = v.to || DEFAULT_TO;
    msg.textContent = v.msg || DEFAULT_MSG;
    fromLine.textContent = v.from ? 'Con cariño, ' + v.from : '';
    updateLink(v);
    return v;
  }

  var hasHash = location.hash.length > 1;
  if (hasHash) document.body.classList.add('pending', 'recipient');
  readShared().then(function (shared) {
    var blank = { to: '', msg: '', from: '', pj: 'a' };
    var initial = shared || (hasHash ? blank : (readStored() || blank));
    inTo.value = initial.to || '';
    inMsg.value = initial.msg || '';
    inFrom.value = initial.from || '';
    setCharacter(initial.pj);
    document.body.classList.remove('pending');
    refresh();
  });

  [inTo, inMsg, inFrom].forEach(function (el) {
    el.addEventListener('input', function () {
      writeStored(refresh());
      linkStatus.textContent = '';
    });
  });
  choices.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setCharacter(btn.getAttribute('data-pj'));
      lineIdx = 1;
      say(LINES[pj][0], 2600);
      writeStored(refresh());
      linkStatus.textContent = '';
      jumpEl.classList.remove('jump');
      void jumpEl.getBoundingClientRect();
      jumpEl.classList.add('jump');
      var h = activeHead().getBoundingClientRect();
      burst(h.left + h.width / 2, h.top + h.height / 2, ['spark', 'flower'], 6, false);
    });
  });
  window.addEventListener('hashchange', function () { location.reload(); });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var link = linkOut.value;
    var done = function () { linkStatus.textContent = 'Enlace copiado. Ya se puede enviar.'; };
    var fallback = function () {
      linkOut.focus();
      linkOut.select();
      linkStatus.textContent = 'Selecciona el enlace y cópialo manualmente.';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, fallback);
    } else {
      fallback();
    }
  });

  var shareBtn = document.getElementById('shareBtn');
  if (navigator.share) {
    shareBtn.hidden = false;
    shareBtn.addEventListener('click', function () {
      navigator.share({ title: 'Un ramo para ti', url: linkOut.value }).catch(function () {});
    });
  }

  var panel = document.getElementById('panel');
  var editBtn = document.getElementById('editBtn');
  editBtn.addEventListener('click', function () {
    var open = panel.hasAttribute('hidden');
    if (open) { panel.removeAttribute('hidden'); inTo.focus(); } else { panel.setAttribute('hidden', ''); }
    editBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    editBtn.textContent = open ? 'Listo' : 'Personalizar';
  });

  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', soundOn ? 'Sonido activado' : 'Sonido desactivado');
    soundBtn.textContent = soundOn ? 'Sonido' : 'Sin sonido';
  });
  })();
</script>
</body>
</html>
